name: basket_dbt
profile: basketanalysis

# Diga ao dbt onde estão suas seeds
seed-paths: ["basket_dbt/seeds"]

seeds:
  +encoding: utf-8
  +quote_columns: true
  +schema: raw        # => schema físico: analytics_raw

models:
  +materialized: view
  basket_dbt:
    staging:
      +schema: raw    # => analytics_raw
      # Desabilite TEMPORARIAMENTE para o parse passar
    enriched:
      +schema: enriched
