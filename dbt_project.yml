name: nba_analytics
version: "1.0.0"
config-version: 2

profile: nba_analytics

model-paths:    ["models"]
seed-paths:     ["seeds"]
macro-paths:    ["macros"]
analysis-paths: ["analyses"]
test-paths:     ["tests"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# ── Seeds (raw layer) ────────────────────────────────────────────────────────
seeds:
  nba_analytics:
    +schema: raw
    +quote_columns: true

# ── Models ──────────────────────────────────────────────────────────────────
models:
  nba_analytics:
    staging:
      +materialized: view
      +schema: staging

    intermediate:
      +materialized: view
      +schema: intermediate

    marts:
      +materialized: table
      +schema: marts
