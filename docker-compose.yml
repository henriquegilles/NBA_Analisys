services:

  # ── PostgreSQL — the project's main database ──────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: nba_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DBT_DBNAME:-nba}
      POSTGRES_USER:     ${DBT_USER:-postgres}
      POSTGRES_PASSWORD: ${DBT_PASSWORD:-postgres}
    ports:
      - "${DBT_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # "Disposable dev" tuning: the database is 100% regenerable from the seeds
    # (`dbt seed`), so we trade crash durability for write speed — makes
    # `dbt seed`/`run --full-refresh` faster. NEVER do this in prod: a crash
    # can corrupt the cluster; here you just run `dbt seed` again.
    command:
      - postgres
      - -c
      - fsync=off               # don't force a disk flush on every commit
      - -c
      - synchronous_commit=off  # acknowledge the commit before writing to the WAL
      - -c
      - full_page_writes=off    # skip torn-page protection
    # Resource cap: 841 rows don't need more than this, and it keeps postgres
    # from competing for RAM/CPU with headless Chrome during scraping
    # (documented cause of OOM — see .wslconfig and runbook #23).
    mem_limit: 768m
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBT_USER:-postgres} -d ${DBT_DBNAME:-nba}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
