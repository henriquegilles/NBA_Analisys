name: dbt Docs

on:
  push:
    branches: [master, main]
    paths:
      - "dbt/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:    # allow manual runs from the GitHub UI

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    name: Generate & Deploy dbt Docs
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       nba
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_HOST:     localhost
      DBT_PORT:     "5432"
      DBT_DBNAME:   nba
      DBT_USER:     postgres
      DBT_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Same sample-seed strategy as ci.yml: real data is gitignored, so the
      # docs build runs on the versioned samples in ci/sample_seeds/.
      - name: Stage sample seeds
        run: cp ci/sample_seeds/*.csv dbt/seeds/

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt seed + run (needed for a manifest with results)
        working-directory: dbt
        run: |
          uv run dbt seed
          uv run dbt run

      - name: dbt docs generate
        working-directory: dbt
        run: uv run dbt docs generate

      - name: Prepare site for GitHub Pages
        run: |
          mkdir -p public
          cp dbt/target/index.html       public/
          cp dbt/target/manifest.json    public/
          cp dbt/target/catalog.json     public/
          cp dbt/target/run_results.json public/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    needs: build-docs
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
