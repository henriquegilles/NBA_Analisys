name: dbt CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - "dbt/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [master, main]
    paths:
      - "dbt/**"
      - "pyproject.toml"
      - "uv.lock"

jobs:
  dbt-ci:
    name: Compile & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       nba
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DBT_HOST:     localhost
      DBT_PORT:     "5432"
      DBT_DBNAME:   nba
      DBT_USER:     postgres
      DBT_PASSWORD: postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v8
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --no-dev

      # Real seed data is gitignored (regenerable by the scrapers). CI runs the
      # pipeline end-to-end on small, consistent samples versioned in
      # ci/sample_seeds/ (generated by ci/make_sample_seeds.py).
      - name: Stage sample seeds
        run: cp ci/sample_seeds/*.csv dbt/seeds/

      - name: dbt deps
        working-directory: dbt
        run: uv run dbt deps

      - name: dbt compile
        working-directory: dbt
        run: uv run dbt compile

      - name: dbt seed
        working-directory: dbt
        run: uv run dbt seed

      - name: dbt run
        working-directory: dbt
        run: uv run dbt run

      - name: dbt test
        working-directory: dbt
        run: uv run dbt test
