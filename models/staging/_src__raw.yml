version: 2

sources:
  - name: raw
    description: "Dados brutos carregados via dbt seed a partir de CSVs gerados pelo scraping do Basketball Reference."
    tables:
      - name: players
        description: "Roster de jogadores (nome, posição, altura, peso, time atual)."

      - name: players_stats
        description: "Estatísticas de jogadores por temporada (pontos, rebotes, assistências, etc.)."

      - name: team
        description: "Histórico de franquias NBA (conferência, divisão, temporadas, títulos)."

      - name: contracts
        description: "Contratos dos jogadores (salário por ano, 2025–2030). Gerado por scraping/contracts/nba_contracts.ipynb."
