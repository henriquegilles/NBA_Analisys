version: 2

models:
  - name: stg_bbr__players
    description: >
      Cleaned player roster from BBR per-game page. One row per player-team stint.
      Players traded mid-season appear once per team plus a "2TM/3TM" aggregate row.
    columns:
      - name: player_name
        description: Player full name (trimmed)
        data_tests:
          - not_null
      - name: team_abbr
        description: BBR three-letter team abbreviation, uppercased
      - name: position
        description: Primary position (G, F, C or combinations)
      - name: age
        description: Player age, cast to integer

  - name: stg_bbr__player_stats
    description: >
      Per-game statistical lines from BBR. Same traded-player duplication
      as stg_bbr__players. All percentage columns kept as decimals (0–1 range).
    columns:
      - name: player_name
        data_tests:
          - not_null
      - name: team_abbr
        description: "2TM/3TM for season aggregate rows, otherwise team abbreviation"
      - name: games_played
        description: Total games played in the stint/season
      - name: points_per_game
        description: Average points scored per game

  - name: stg_bbr__teams
    description: >
      Historical franchise summary rows from BBR teams page. Multiple rows per
      franchise when they relocated (e.g., Seattle → Oklahoma City).
    columns:
      - name: franchise_name
        data_tests:
          - not_null
      - name: win_loss_pct
        description: Career win-loss percentage as decimal (0–1)

  - name: stg_bbr__player_gamelogs
    description: >
      Per-player per-game stats from BBR game log pages. One row per player × game.
      Richer than box score scraping: includes opponent, result, Game Score.
      Depends on players.csv (and its bbr_id column) being generated first.
    columns:
      - name: bbr_id
        data_tests:
          - not_null
      - name: player_name
        data_tests:
          - not_null
      - name: game_date
        data_tests:
          - not_null
      - name: home_away
        data_tests:
          - accepted_values:
              values: ['home', 'away']
      - name: result
        data_tests:
          - accepted_values:
              values: ['W', 'L', null]
      - name: game_score
        description: Hollinger Game Score per game

  - name: stg_bbr__box_scores
    description: >
      Per-player per-game box scores scraped from BBR. Grain: player × game.
      Only basic stats (not advanced). Append-only by date range.
    columns:
      - name: game_id
        data_tests:
          - not_null
      - name: game_date
        data_tests:
          - not_null
      - name: player_name
        data_tests:
          - not_null
      - name: home_away
        data_tests:
          - accepted_values:
              values: ['home', 'away']
      - name: pts
        description: Points scored in this game

  - name: stg_bbr__draft
    description: >
      NBA Draft picks from 1986–2025. One row per pick. Career stats are
      cumulative totals at time of scraping. Players who never reached the NBA
      have null career stat columns.
    columns:
      - name: draft_year
        data_tests:
          - not_null
      - name: pick
        data_tests:
          - not_null
      - name: player_name
        data_tests:
          - not_null
      - name: round
        description: "1 or 2"
      - name: win_shares
        description: Career Win Shares accumulated through last season scraped
      - name: vorp
        description: Career Value Over Replacement Player

  - name: stg_bbr__player_advanced_stats
    description: >
      Advanced statistical lines from BBR — both regular season and playoffs.
      One row per player × season × season_type. Traded players appear once
      per team plus a "2TM/3TM" aggregate row (de-duped in intermediate layer).
    columns:
      - name: player_name
        data_tests:
          - not_null
      - name: season
        description: "Season label, e.g. '2025-26'"
        data_tests:
          - not_null
      - name: season_type
        description: "'regular' or 'playoffs'"
        data_tests:
          - not_null
          - accepted_values:
              values: ['regular', 'playoffs']
      - name: per
        description: Player Efficiency Rating
      - name: ts_pct
        description: True Shooting percentage (decimal)
      - name: win_shares
        description: Total Win Shares for the season/stint
      - name: bpm
        description: Box Plus/Minus
      - name: vorp
        description: Value Over Replacement Player

  - name: stg_bbr__contracts
    description: >
      Player contract data from BBR contracts page. Pode ter o mesmo jogador
      repetido (deduplicado em dim_player_contract). Salary columns are strings
      (BBR formats as "$12,345,678") — parsing to numeric is done in the marts layer.
    columns:
      - name: player_name
        description: Player full name
        data_tests:
          - not_null
      - name: team_abbr
        description: Current team abbreviation
      - name: salary_2025_26
        description: Salary for the 2025-26 season (string, formatted by BBR)
      - name: guaranteed
        description: Total guaranteed money remaining on the contract

  - name: stg_bbr__nba_careers
    description: >
      Grão: 1 linha por jogador NBA (linha "Career" da página do BBR).
      Fornece stl/blk(→stocks), 3PM e TOV de carreira que o seed `draft` não
      traz — usado pela ponte college→NBA (D-30) via slug bbr_id.
    columns:
      - name: bbr_id
        description: "PK — slug NBA do jogador no Basketball Reference"
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Nome do jogador
        data_tests:
          - not_null
      - name: career_games
        description: "Jogos na carreira (pode ser null — BBR nem sempre repete G nessa linha)"
      - name: pg_pts
        description: Pontos por jogo na carreira
      - name: pg_trb
        description: Rebotes por jogo na carreira
      - name: pg_ast
        description: Assistências por jogo na carreira
      - name: pg_stl
        description: Roubos por jogo na carreira
      - name: pg_blk
        description: Tocos por jogo na carreira
      - name: pg_fg3
        description: Cestas de 3 por jogo na carreira
      - name: pg_tov
        description: Turnovers por jogo na carreira
