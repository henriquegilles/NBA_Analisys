version: 2

models:
  - name: int_players__deduped
    description: >
      One row per player for the current season. Traded players are represented
      by their "TOT" (total) row only; per-team rows are dropped.
      Use this model when you need a unique player list without double-counting.
    columns:
      - name: player_name
        description: Player full name
        data_tests:
          - unique
          - not_null
      - name: team_abbr
        description: >
          Team abbreviation. "TOT" for players traded mid-season
          (represents their full-season aggregate, not a real team).
      - name: position
        description: Player position
      - name: age
        description: Player age

  - name: int_games__from_gamelogs
    description: >
      Deriva entidades únicas de jogo a partir dos game logs individuais.
      Grain: 1 linha por jogo (game_date × home_team_abbr).
      Converte atributos de perspectiva do jogador para perspectiva do jogo.
    columns:
      - name: game_date
        data_tests:
          - not_null
      - name: home_team_abbr
        data_tests:
          - not_null
      - name: away_team_abbr
        data_tests:
          - not_null
      - name: home_result
        description: "'W' se o time da casa ganhou, 'L' se perdeu"
      - name: home_point_diff
        description: Margem do ponto de vista do time da casa (positivo = casa ganhou)

  - name: int_player_stats__season_totals
    description: >
      One statistical row per player for the full season.
      Same de-duplication logic as int_players__deduped applied to stats.
      Safe to join directly with dim_player on player_name.
    columns:
      - name: player_name
        description: Player full name
        data_tests:
          - unique
          - not_null
      - name: points_per_game
        description: Season average points per game
      - name: games_played
        description: Total games played in the season

  - name: int_player__fantasy_categories
    description: >
      Grão: jogador × jogo. Isola as 7 categorias da liga Bandeja de 3 a partir
      de fct_player_game_log e deriva STOCKS (stl + blk). TOV é mantido normal —
      a inversão é aplicada no z-score. Base das valorações fantasy (Domínio A).
    columns:
      - name: game_player_key
        description: "PK herdada de fct_player_game_log — MD5 de (bbr_id, game_date)"
        data_tests:
          - unique
          - not_null
      - name: bbr_id
        description: Identificador BBR do jogador
        data_tests:
          - not_null
      - name: stocks
        description: "Categoria derivada: roubos + tocos (stl + blk)"

  - name: int_prospect__college_stats
    description: >
      Grão: jogador × temporada de college (acima do piso de minutos, 200 por
      padrão). Perfil do prospecto para o scouting (Domínio B): 6 categorias
      por-40-min + contexto (class_rank, arquétipo G/F/C, TS%, usage, SOS) +
      trajetória padronizada (z-score do delta de produção vs. temporada
      anterior). Base dos outcomes históricos e dos comps da classe atual.
    columns:
      - name: cbb_id
        description: Slug do jogador no College Basketball Reference
        data_tests:
          - not_null
      - name: season
        description: "Temporada de college, ex '2018-19'"
        data_tests:
          - not_null
      - name: archetype
        description: "Arquétipo grosso derivado da posição (D-28): guard/wing/big"
        data_tests:
          - accepted_values:
              values: ['guard', 'wing', 'big', 'unknown']
      - name: class_rank
        description: "Senioridade ordinal (FR=1…SR=4), proxy de idade (D-26)"
        data_tests:
          - accepted_values:
              values: [1, 2, 3, 4]
      - name: trajectory_flag
        description: "Evolução vs. temporada anterior (D-24): melhorando/estavel/piorando/sem_historico"
        data_tests:
          - accepted_values:
              values: ['melhorando', 'estavel', 'piorando', 'sem_historico']
      - name: stocks_per_40
        description: "Categoria derivada por-40: roubos + tocos"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - cbb_id
            - season

  - name: int_prospect__comps
    description: >
      Grão: prospecto × comp (k=8 linhas por prospecto). Mecânica de comparáveis
      do scouting (Domínio B): para cada prospecto (temporada mais recente, D-12),
      os k jogadores college mais parecidos por distância euclidiana sobre 9
      features padronizadas (D-21), no mesmo arquétipo G/F/C com fallback (D-28).
      Sem o lado NBA ainda — fct_prospect_scouting plugará os desfechos depois.
    columns:
      - name: prospect_id
        description: cbb_id do prospecto
        data_tests:
          - not_null
      - name: comp_id
        description: cbb_id do comparável
        data_tests:
          - not_null
      - name: comp_rank
        description: "Ordem do comp por proximidade (1 = mais parecido), 1..k"
        data_tests:
          - not_null
      - name: used_archetype_fallback
        description: "true se o arquétipo tinha < k candidatos e caiu pro pool geral"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - prospect_id
            - comp_rank
