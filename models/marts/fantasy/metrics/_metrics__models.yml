version: 2

models:
  - name: vw_my_roster_metrics
    description: >
      Métricas do elenco do Lobos Comunistas (franchise 528): valor punt-TOV e z por
      categoria por jogador. Fonte do painel "meu time" no dataviz.
    columns:
      - name: player_name
        tests: [not_null]
      - name: value_punt_tov
        description: z_total menos z_tov (punt-TOV) — métrica central do contexto.

  - name: fct_league_category_strength
    description: Força de cada franquia por categoria (soma dos z do top-10). Rival scan.
    columns:
      - name: franchise_id
        tests: [not_null, unique]   # 1 linha por franquia
      - name: league_rank
        tests: [not_null, unique]   # ranking sem empate/lacuna
      - name: total_va
        tests: [not_null]

  - name: fct_team_cap
    description: Folha, espaço e vagas por franquia (teto $190M, salários em $M).
    columns:
      - name: franchise_id
        tests: [not_null, unique]
      - name: payroll_y1_m
        description: Folha do Ano 1 em $M.
        tests:
          # GUARDRAIL do bug de unidade ($ cheios vs $M): folha sã entre 0 e 200M
          - dbt_utils.accepted_range:
              min_value: 0
              max_value: 200
      - name: cap_space_m
        tests: [not_null]

  - name: fct_fa_targets
    description: >
      Alvos de Free Agency (não contratados) ranqueados por fit punt-TOV, com flag de
      match (proxy playoff). GUARDRAIL de acento: nenhum jogador contratado deve vazar aqui.
    columns:
      - name: player_name
        tests: [not_null]
      - name: fit_score
        tests: [not_null]
      - name: holder_can_match
        tests: [not_null]

  - name: fct_draft_board
    description: >
      Board de draft ajustado por oportunidade (talento × time NBA final, via
      nba_landing_spots — corrige o erro de draft-night). Confiança do modelo sempre exposta.
    columns:
      - name: prospect_name
        tests: [not_null]
      - name: opportunity_mult
        tests:
          - dbt_utils.accepted_range: { min_value: 0.5, max_value: 1.6 }
      - name: model_confidence
        # nunca esconder a incerteza dos prospectos 2026 (comps de baixa confiança)
        tests: [not_null]
