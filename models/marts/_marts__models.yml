version: 2

# ════════════════════════════════════════════════════════════════════════════
# DIMENSÕES
# ════════════════════════════════════════════════════════════════════════════

models:

  # ── dim_game ───────────────────────────────────────────────────────────────
  - name: dim_game
    description: >
      Entidade de jogo. Grain: 1 linha por partida (game_date × home_team_abbr).
      Derivada de int_games__from_gamelogs, que consolida o contexto do jogo
      a partir dos game logs individuais dos jogadores.
      Resolve o problema de atributos de jogo duplicados em fct_player_game_log.
    columns:
      - name: game_key
        description: "PK — MD5(game_date, home_team_abbr)"
        data_tests:
          - unique
          - not_null
      - name: game_date
        data_tests:
          - not_null
      - name: season
        data_tests:
          - not_null
      - name: home_team_abbr
        data_tests:
          - not_null
      - name: away_team_abbr
        data_tests:
          - not_null
      - name: home_team_key
        description: "FK → dim_team.team_key (time da casa)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: away_team_key
        description: "FK → dim_team.team_key (visitante)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: home_result
        description: "'W' se o time da casa ganhou"
        data_tests:
          - accepted_values:
              values: ['W', 'L', null]
      - name: home_point_diff
        description: Margem do ponto de vista do time da casa

  # ── dim_player ─────────────────────────────────────────────────────────────
  - name: dim_player
    description: >
      Dimensão de jogadores da temporada atual. Uma linha por jogador.
      Jogadores trocados são resolvidos para o último time pelo qual jogaram.
      bbr_id é o identificador estável do Basketball Reference e serve de
      chave natural para joins com fct_player_game_log.
    config:
      contract:
        enforced: true
    columns:
      - name: player_key
        description: "PK — surrogate key MD5(bbr_id)"
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: player_name
        description: Nome completo do jogador
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: bbr_id
        description: >
          Identificador BBR (ex: "jamesle01"). Chave natural usada pelo
          fct_player_game_log para joins estáveis mesmo com variações de nome.
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: position
        description: Posição principal (G, F, C ou combinações)
        data_type: varchar
      - name: age
        description: Idade do jogador
        data_type: integer
      - name: current_team_abbr
        description: >
          FK → dim_team.team_abbr.
          Para jogadores trocados, é o último time da temporada.
        data_type: varchar
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_abbr
      - name: current_team_name
        description: Nome completo do time atual
        data_type: varchar
      - name: conference
        description: Conferência (East / West)
        data_type: varchar
        data_tests:
          - accepted_values:
              values: ['East', 'West']
      - name: division
        description: Divisão (Atlantic, Central, Southeast, Northwest, Pacific, Southwest)
        data_type: varchar

  # ── dim_team ───────────────────────────────────────────────────────────────
  - name: dim_team
    description: >
      Dimensão de times. Uma linha por franquia ativa (30 times).
      Estatísticas históricas vêm do BBR filtradas para a era de maior volume
      de jogos da franquia.
    config:
      contract:
        enforced: true
    columns:
      - name: team_key
        description: "PK — surrogate key MD5(team_abbr)"
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: team_abbr
        description: "Abreviação BBR de 3 letras (ex: LAL, BOS)"
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: team_name
        description: Nome completo da franquia
        data_type: varchar
      - name: city
        description: Cidade sede
        data_type: varchar
      - name: conference
        data_type: varchar
        data_tests:
          - accepted_values:
              values: ['East', 'West']
      - name: division
        data_type: varchar
      - name: wins
        description: Vitórias históricas acumuladas
        data_type: integer
      - name: losses
        description: Derrotas históricas acumuladas
        data_type: integer
      - name: win_loss_pct
        description: Percentual de vitórias (0–1)
        data_type: numeric
      - name: playoff_appearances
        data_type: integer
      - name: division_titles
        data_type: integer
      - name: conference_titles
        data_type: integer
      - name: championships
        data_type: integer

# ════════════════════════════════════════════════════════════════════════════
# FATOS
# ════════════════════════════════════════════════════════════════════════════

  # ── fct_player_season_stats ────────────────────────────────────────────────
  - name: fct_player_season_stats
    description: >
      Grain: jogador × temporada. Médias por jogo da temporada regular.
      Jogadores trocados têm uma linha usando o row TOT/NTM (média ponderada).
    columns:
      - name: fact_key
        description: "PK — MD5(player_name, season)"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "FK → dim_player.player_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_key
      - name: team_key
        description: "FK → dim_team.team_key"
      - name: player_name
        data_tests:
          - not_null
      - name: season
        description: "Temporada no formato YYYY-YY (ex: 2025-26)"
        data_tests:
          - not_null
      - name: games_played
      - name: games_started
      - name: minutes_per_game
      - name: points_per_game
      - name: fg_pct
        description: Field goal % como decimal (0–1)

  # ── fct_player_advanced_stats ──────────────────────────────────────────────
  - name: fct_player_advanced_stats
    description: >
      Grain: jogador × temporada × season_type.
      Métricas avançadas (PER, WS, BPM, VORP) para temporada regular e playoffs.
    columns:
      - name: fact_key
        description: "PK — MD5(player_name, season, season_type)"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "FK → dim_player.player_key"
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_player')
              field: player_key
      - name: team_key
        description: "FK → dim_team.team_key"
      - name: season
        data_tests:
          - not_null
      - name: season_type
        description: "'regular' ou 'playoffs'"
        data_tests:
          - not_null
          - accepted_values:
              values: ['regular', 'playoffs']
      - name: per
        description: Player Efficiency Rating
      - name: ts_pct
        description: True Shooting %
      - name: win_shares
        description: Win Shares acumulados na temporada
      - name: bpm
        description: Box Plus/Minus
      - name: vorp
        description: Value Over Replacement Player

  # ── fct_player_game_log ────────────────────────────────────────────────────
  - name: fct_player_game_log
    description: >
      Grain: jogador × jogo. Stats de cada partida individualmente.
      Inclui adversário (FK → dim_team), resultado e Game Score de Hollinger.
      Fonte: páginas de game log individuais do BBR (não box score por data).
    columns:
      - name: game_player_key
        description: "PK — MD5(bbr_id, game_date)"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "FK → dim_player.player_key (join via bbr_id — estável)"
        data_tests:
          - relationships:
              to: ref('dim_player')
              field: player_key
      - name: team_key
        description: "FK → dim_team.team_key (time do jogador)"
      - name: opponent_team_key
        description: "FK → dim_team.team_key (time adversário)"
        data_tests:
          - relationships:
              to: ref('dim_team')
              field: team_key
      - name: game_key
        description: "FK → dim_game.game_key"
        data_tests:
          - relationships:
              to: ref('dim_game')
              field: game_key
      - name: bbr_id
        description: "Identificador BBR do jogador (ex: jamesle01)"
        data_tests:
          - not_null
      - name: season
        description: "Temporada (ex: 2025-26)"
        data_tests:
          - not_null
      - name: game_date
        description: Data da partida
        data_tests:
          - not_null
      - name: home_away
        description: "Dimensão degenerada — perspectiva do jogador"
        data_tests:
          - accepted_values:
              values: ['home', 'away']
      - name: result
        description: "'W' | 'L' — perspectiva do time do jogador"
        data_tests:
          - accepted_values:
              values: ['W', 'L', null]
      - name: minutes_played
        description: "Minutos jogados como decimal (ex: 32.23)"
      - name: pts
        description: Pontos marcados no jogo
      - name: game_score
        description: >
          Game Score de Hollinger — resume a partida em um único número.
          Fórmula: pts + 0.4*fg − 0.7*fga − 0.4*(fta−ft) + 0.7*orb + 0.3*drb
                   + stl + 0.7*ast + 0.7*blk − 0.4*pf − tov

  # ── fct_draft_class ────────────────────────────────────────────────────────
  - name: fct_draft_class
    description: >
      Grain: draft_year × pick. 40 anos de escolhas do Draft NBA (1986–2025).
      Inclui estatísticas de carreira acumuladas e métricas avançadas.
      player_key é nullable — jogadores que nunca chegaram à NBA não existem em dim_player.
    columns:
      - name: draft_pick_key
        description: "PK — MD5(draft_year, pick)"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "FK → dim_player.player_key (null se nunca jogou na NBA)"
        data_tests:
          - relationships:
              to: ref('dim_player')
              field: player_key
              config:
                where: "player_key is not null"
      - name: draft_year
        description: Ano do Draft
        data_tests:
          - not_null
      - name: round
        description: Rodada (1 ou 2)
      - name: pick
        description: Número geral da escolha
        data_tests:
          - not_null
      - name: drafting_team
        description: "FK → dim_team.team_abbr (time que escolheu o jogador)"
      - name: player_name
        data_tests:
          - not_null
      - name: college
        description: Faculdade / país de origem
      - name: career_seasons
        description: Temporadas na NBA
      - name: win_shares
        description: Win Shares de carreira
      - name: vorp
        description: VORP de carreira
      - name: career_stats_as_of
        description: "Data do último rebuild dbt — marca quando os stats de carreira foram atualizados"
        data_tests:
          - not_null
      - name: reached_3_seasons
        description: "TRUE se o jogador completou ≥ 3 temporadas na NBA"

  # ── dim_player_contract ────────────────────────────────────────────────────
  - name: dim_player_contract
    description: >
      Grain: jogador (snapshot atual de contrato). Salários por temporada e
      mecanismo CBA (Bird Rights, MLE, etc.). Salários chegam como strings
      formatadas pelo BBR ("$12,345,678") — parse para numérico em análises.
      É uma dimensão, não um fato: representa estado atual, não evento.
      Histórico de mudanças capturado em snapshots.player_contract_snapshot.
    columns:
      - name: contract_key
        description: "PK — MD5(player_name)"
        data_tests:
          - unique
          - not_null
      - name: player_key
        description: "FK → dim_player.player_key"
        data_tests:
          - relationships:
              to: ref('dim_player')
              field: player_key
      - name: team_key
        description: "FK → dim_team.team_key"
      - name: player_name
        data_tests:
          - not_null
      - name: salary_2024_25
        description: "Salário 2024-25 (string, ex: '$12,345,678')"
      - name: salary_2025_26
        description: "Salário 2025-26"
      - name: salary_2026_27
        description: "Salário 2026-27"
      - name: salary_2027_28
        description: "Salário 2027-28"
      - name: salary_2028_29
        description: "Salário 2028-29"
      - name: signed_using
        description: "Mecanismo CBA (ex: Bird Rights, MLE, Rookie Scale)"
      - name: guaranteed
        description: "Total garantido restante no contrato"
